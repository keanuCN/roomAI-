name: roomai
x-backend: &backend
  build: {context: ., dockerfile: backend/Dockerfile}
  env_file: .env
  environment:
    DATABASE_URL: postgresql+psycopg://roomai:${POSTGRES_PASSWORD:-roomai-local-demo}@postgres:5432/roomai
    REDIS_URL: redis://redis:6379/0
    STORAGE_BACKEND: s3
    S3_ENDPOINT: http://minio:9000
    S3_ACCESS_KEY: ${MINIO_ROOT_USER:-roomai}
    S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-roomai-local-storage}
    S3_BUCKET: roomai
  restart: unless-stopped
  depends_on:
    postgres: {condition: service_healthy}
    redis: {condition: service_healthy}
    minio: {condition: service_healthy}
services:
  web:
    build: {context: ., dockerfile: web/Dockerfile}
    ports: ["${WEB_PORT:-3100}:3000"]
    environment: {API_INTERNAL_URL: "http://api:8000"}
    depends_on:
      api: {condition: service_healthy}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
  api:
    <<: *backend
    ports: ["127.0.0.1:${API_PORT:-8010}:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
  worker:
    <<: *backend
    command: ["python", "-m", "app.worker"]
    depends_on:
      api: {condition: service_healthy}
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: roomai
      POSTGRES_USER: roomai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-roomai-local-demo}
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U roomai"]
      interval: 5s
      retries: 12
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redis-data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10
    restart: unless-stopped
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-roomai}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-roomai-local-storage}
    ports: ["127.0.0.1:9011:9001"]
    volumes: [object-data:/data]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      retries: 15
    restart: unless-stopped
volumes:
  postgres-data:
  redis-data:
  object-data:
